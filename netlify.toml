# MARYAM LUXE static storefront deployment
# The repository remains private; Netlify connects through the owner's GitHub authorization.
[build]
  publish = "."

# Do not expose private admin pages or backend source files through the public deploy.
# Public storefront pages are deployed from the repository root; admin pages are denied.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/products.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/orders.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/shipping.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/team.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Prevent accidental exposure of repository-side source folders.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
